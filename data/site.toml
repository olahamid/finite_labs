# --------------------------------------------------------------------- about
[about]
heading = "About Finite Labs"
paragraphs = [
  "Finite Labs is a cryptography company based in Nigeria. We build cryptographic software and hardware, teach the knowledge behind it, and publish open research, so that people and organisations keep ownership and control of their own data.",
  "Products and education carry equal weight. Our tools solve real security problems, and our lessons, courses and training help people understand and use cryptography correctly.",
  "We never invent our own cryptographic algorithms. Everything we teach and build uses well-studied, audited primitives.",
]
