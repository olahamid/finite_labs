# ---------------------------------------------------------------------- hero
[hero]
eyebrow = "Software · Hardware · Education · Research"
# Draft headline — final wording TBD (PRD §5.1).
headline = "Cryptography you can own."
subline = "Finite Labs builds real-world cryptographic software and hardware, teaches the knowledge behind it, and publishes open research, to put digital ownership and control back in your hands."
